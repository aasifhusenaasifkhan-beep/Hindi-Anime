<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP Unlock - Hindi Subbed Anime</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
<header><a href="index.html" class="logo">Hindi <span>Subbed Anime</span></a></header>

<div class="box">
<h3>VIP Unlock</h3>
<p class="mu">VIP Gmail + Passcode daalo, direct download bina shortener ke milega.</p>
<p><input id="e" placeholder="Gmail" style="width:100%;background:#1a1d26;border:1px solid #2e2e32;color:#fff;border-radius:10px;padding:11px"></p>
<p><input id="k" type="password" placeholder="Passcode" style="width:100%;background:#1a1d26;border:1px solid #2e2e32;color:#fff;border-radius:10px;padding:11px"></p>
<button class="pill" style="background:#ff8c00;color:#111;width:100%;padding:12px;margin-top:8px;font-weight:800" onclick="go()">Unlock</button>
<p id="r" class="mu" style="margin-top:10px"></p>
</div>

<div id="ban"></div>
</div>

<script src="assets/js/app.js"></script>
<script>
const kkLocal=s=>String(s||'').trim().toLowerCase();
async function go(){
  const out=document.getElementById('r');
  const email=kkLocal(document.getElementById('e').value);
  const pass=document.getElementById('k').value.trim();
  if(!email||!pass){ out.textContent='Email + Passcode daalo'; return; }
  try{
    const r=await fetch('/api/vip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){ out.textContent=j.error||'Gmail ya passcode galat'; return; }
    localStorage.setItem('vemail',email); localStorage.setItem('vpass',pass); localStorage.setItem('vexp',String(j.exp));
    localStorage.removeItem('vk');
    out.textContent='VIP active! Ab post par Direct button dikhega. 2 sec me home...';
    setTimeout(()=>location.href='index.html',1500);
  }catch(e){ out.textContent='Network error'; }
}
</script>
</body>
</html>
