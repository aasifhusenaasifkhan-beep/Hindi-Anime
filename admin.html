<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - DB Setup</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* CSS Wahi purani rahegi */
:root { --bg: #05080c; --card: #0d121c; --ln: rgba(0, 255, 102, 0.15); --tx: #f0fdf4; --mu: #94a3b8; --ac: #00ff66; --gradient: linear-gradient(135deg, #00ff66 0%, #00f2fe 100%); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.5 'Segoe UI', system-ui; padding-bottom: 50px; }
.w { max-width: 760px; margin: auto; padding: 12px; }
h1 { font-size: 20px; color: var(--ac); text-align: center; margin-bottom: 20px; }
h2 { font-size: 16px; color: var(--ac); border-bottom: 1px solid var(--ln); padding-bottom: 6px; margin: 18px 0 12px; }
label { display: block; margin: 10px 0 4px; color: var(--mu); font-size: 11px; font-weight: 700; text-transform: uppercase; }
.form-control { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--ln); color: #fff; border-radius: 8px; padding: 11px; outline: none; font-size: 13px; }
.form-control:focus { border-color: var(--ac); }
textarea.form-control { min-height: 70px; }
.btn-action { width: 100%; padding: 12px; background: var(--gradient); color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; margin-top: 12px; font-size: 14px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; border-bottom: 1px solid var(--ln); margin-bottom: 15px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.ep-btn { background: rgba(0,255,102,0.06); border: 1px solid var(--ln); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
.ep-btn.on { background: var(--ac); color: #000; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--ln); background: rgba(0,0,0,0.2); border-radius: 8px; margin-top: 8px; }
.p { display: none; }.p.on { display: block; }
#log { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #111e16; color: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--ac); display: none; z-index: 99; font-weight: bold; text-align: center; }
#appBody { display: none; }
.danger { background: #ff4d4d; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
</style>
</head><body><div class="w">

<h1><i class="fa-solid fa-gear"></i> Admin Control Center</h1>

<div id="loginSection" style="background:var(--card); border:1px solid var(--ln); border-radius:12px; padding:25px 20px; text-align:center;">
  <p style="color:var(--mu); font-size:12px; margin-bottom:20px;">Secure Database Login</p>
  <input id="adminPass" type="password" class="form-control" placeholder="Enter Admin Password..." style="text-align:center; font-weight:bold; letter-spacing:1px; margin-bottom:15px;">
  <button class="btn-action" id="btnLoad" onclick="loadFromDB()">ðŸ”“ Unlock Panel</button>
</div>

<div id="appBody">
  <div class="tabs">
    <button data-t="post" class="ep-btn on" onclick="tab('post')">Add Post</button>
    <button data-t="ep" class="ep-btn" onclick="tab('ep')">Episodes</button>
    <button data-t="del" class="ep-btn" onclick="tab('del')">Delete</button>
    <button data-t="sh" class="ep-btn" onclick="tab('sh')">Shorteners</button>
    <button data-t="vip" class="ep-btn" onclick="tab('vip')">VIP</button>
    <button data-t="ads" class="ep-btn" onclick="tab('ads')">Ads & App</button>
    <button data-t="set" class="ep-btn" onclick="tab('set')">Settings</button>
    <button data-t="push" class="ep-btn" onclick="tab('push')" style="background:#00b359; color:#fff;">ðŸš€ Push Live</button>
  </div>

  <div class="p on" id="t-post">
    <h2><i class="fa-solid fa-plus"></i> Post Add</h2>
    <div style="background: rgba(0,255,102,0.04); padding:10px; border-radius:8px; border:1px dashed var(--ln); margin-bottom:15px;">
      <label style="color:var(--ac); margin-top:0;"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Post Fill Parser</label>
      <textarea id="autoDetectInp" class="form-control" style="height:60px; font-size:11px;" placeholder="Paste text here..." oninput="handleAutoDetect()"></textarea>
    </div>
    <label>Poster Image URL</label>
    <p style="font-size:10px; color:var(--ac); margin:0 0 5px;">âœ… Telegram Link ab directly Support karega (t.me/...)</p>
    <input id="pImg" class="form-control" placeholder="https://..." oninput="document.getElementById('pImgPrev').src=cdnImg(this.value)">
    <img id="pImgPrev" src="https://placehold.co/600x338/0d121c/00ff66?text=Preview" style="width:100%; margin-top:8px; border-radius:8px; border:1px solid var(--ln); aspect-ratio:16/9; object-fit:cover;">
    <label>Anime Name *</label><input id="pName" class="form-control" placeholder="Solo Leveling Hindi Sub">
    <label>Category *</label><input id="pCat" class="form-control" placeholder="Action">
    <label>Genres (comma separated)</label><input id="pGen" class="form-control" placeholder="Action, Fantasy">
    <label>Release Year</label><input id="pYr" class="form-control" placeholder="2024">
    <label>Story</label><textarea id="pSt" class="form-control"></textarea>
    <button class="btn-action" onclick="addPost()">Publish Post</button>
    <div id="plist" style="margin-top:15px;"></div>
  </div>

  <div class="p" id="t-ep">
    <h2><i class="fa-solid fa-video"></i> Add Episode</h2>
    <input id="eSearch" class="form-control" placeholder="Search post..." oninput="renderEpSel()" style="margin-bottom:6px">
    <select id="eP" class="form-control"></select>
    <div class="grid2">
      <div><label>Season</label><input id="eS" class="form-control" value="01"></div>
      <div><label>Episode No *</label><input id="eN" class="form-control" placeholder="01"></div>
    </div>
    <label>Quality</label>
    <select id="eQl" class="form-control"><option>FHD</option><option selected>HD</option><option>SD</option></select>
    <label>Play Link (Optional)</label><input id="ePl" class="form-control" placeholder="https://...">
    <label>Play Password (Optional)</label><input id="ePw" class="form-control" placeholder="Leave blank if no lock">
    <label>Real Download Link (Google Drive etc.) *</label><input id="eDl" class="form-control" placeholder="https://...">
    <button class="btn-action" id="btnEp" onclick="addEpisode()">+ Add Episode (Auto Shortener)</button>
  </div>

  <div class="p" id="t-del"><h2><i class="fa-solid fa-trash"></i> Delete Posts</h2><div id="dlist"></div></div>
  <div class="p" id="t-sh">
    <h2><i class="fa-solid fa-link"></i> Shorteners</h2>
    <div class="grid2"><div><label>Domain</label><input id="sD" class="form-control" placeholder="shrtfly.com"></div><div><label>API Key</label><input id="sK" class="form-control"></div></div>
    <button class="btn-action" onclick="addSh()">+ Add Shortener</button><div id="slist" style="margin-top:15px;"></div>
  </div>
  <div class="p" id="t-vip">
    <h2><i class="fa-solid fa-gem"></i> Create VIP Pass</h2>
    <div class="grid2"><div><label>User Gmail *</label><input id="vE" class="form-control" placeholder="user@gmail.com"></div><div><label>Passcode *</label><input id="vP" class="form-control"></div></div>
    <label>Duration</label><select id="vD" class="form-control"><option value="30">30 Days</option><option value="90">90 Days</option><option value="365">1 Year</option></select>
    <button class="btn-action" onclick="addVip()">+ Add VIP User</button><div id="vlist" style="margin-top:15px;"></div>
  </div>

  <div class="p" id="t-ads">
    <h2><i class="fa-solid fa-rectangle-ad"></i> Ads & APK Link</h2>
    <label>Header Ad Code</label><textarea id="c_head" class="form-control"></textarea>
    <label>Body Ad (Popunder)</label><textarea id="c_body" class="form-control"></textarea>
    <label>Banner Ad (iframe)</label><textarea id="c_ban" class="form-control"></textarea>
    <label>App APK Link</label><input id="c_apk" class="form-control" placeholder="https://...">
  </div>

  <div class="p" id="t-set">
    <h2><i class="fa-solid fa-globe"></i> Site Settings</h2>
    <label>Telegram Channel Link</label><input id="c_tg" class="form-control" placeholder="https://t.me/...">
    <label>Telegram Group</label><input id="c_gr" class="form-control">
    <label>Website URL (Zaroori hai shortener ke liye)</label>
    <input id="c_web" class="form-control" placeholder="https://yoursite.pages.dev">
    <label>Site Name</label><input id="c_site" class="form-control" value="Hindi Subbed Anime">
  </div>

  <div class="p" id="t-push">
    <h2><i class="fa-solid fa-cloud-arrow-up"></i> Save to Database (Live)</h2>
    <button class="btn-action" id="btnPush" onclick="pushToDB()">ðŸš€ Push to Cloudflare Database</button>
  </div>
</div>

<div id="log"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cdnImg(u){
  if(!u) return 'https://placehold.co/600x338/0d121c/00ff66?text=No+Image';
  if(u.includes('t.me') || u.includes('telegra.ph')) return `/api/proxy?url=${encodeURIComponent(u)}`;
  return u;
}

let db={posts:[],vip:[],cfg:{},sh:[]};
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function getVk(){ return await H('Hindi Subbed Anime_VK_BULLETPROOF_2024'); }
const b64enc = bytes => { let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return btoa(bin); };

async function enc(t,p){
  const e=new TextEncoder();
  const s=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},await crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,e.encode(t)));
  const all=new Uint8Array(s.length+iv.length+ct.length);
  all.set(s,0); all.set(iv,s.length); all.set(ct,s.length+iv.length);
  return b64enc(all);
}

function log(t,ok=true){ const el=$('log'); el.textContent=t; el.style.display='block'; el.style.borderColor=ok?'var(--ac)':'#ff4d4d'; setTimeout(()=>el.style.display='none',4000); }
function tab(t){ document.querySelectorAll('.p').forEach(e=>e.classList.toggle('on',e.id==='t-'+t)); document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); }

function handleAutoDetect() {
  const text = $('autoDetectInp').value.trim();
  if (!text) return;
  const lines = text.split(/\n/);
  let parsed = { name: "", category: "", release: "", genres: "" };
  const aliases = [["name", "name"], ["title", "name"], ["category", "category"], ["release", "release"], ["year", "release"], ["genres", "genres"], ["genre", "genres"]];
  lines.forEach(line => {
    for (const [alias, field] of aliases) {
      const m = line.match(new RegExp("^[ \\t]*" + alias + "[ \\t]*[-:=]+[ \\t]*(.*)", "i"));
      if (m) { parsed[field] = m[1].trim(); break; }
    }
  });
  if (parsed.name) $('pName').value = parsed.name;
  if (parsed.category) $('pCat').value = parsed.category;
  if (parsed.genres) $('pGen').value = parsed.genres;
  if (parsed.release) $('pYr').value = parsed.release;
}

// ----------------------------------------------------
// DATABASE LOAD / PUSH FUNCTIONS (Cloudflare Update)
// ----------------------------------------------------
let adminPassCode = "";
async function loadFromDB(){
  const pass = $('adminPass').value.trim();
  if(!pass) return log('Enter Password',false);
  $('btnLoad').disabled=true; $('btnLoad').textContent='Verifying...';
  
  try{
    const r=await fetch(`/api/data?t=${Date.now()}`);
    if(!r.ok) throw new Error("Database Fetch Error");
    const content=await r.json();
    db.posts=content.posts||[]; db.vip=content.vip||[]; db.cfg=content.cfg||{}; db.sh=content.sh||[];
    
    ['head','body','ban','apk','tg','gr','web','site'].forEach(k=>{ if($('c_'+k)) $('c_'+k).value=db.cfg[k]||''; });
    
    adminPassCode = pass;
    log(`Login Success!`);
    $('loginSection').style.display='none';
    $('appBody').style.display='block';
    renderAll();
  }catch(e){ log('Login Fail: '+e.message,false); }
  
  $('btnLoad').textContent='ðŸ”“ Unlock Panel';
  $('btnLoad').disabled=false;
}

async function pushToDB(){
  if(!adminPassCode) return log('Session Expired, Reload Page', false);
  
  ['head','body','ban','apk','tg','gr','web','site'].forEach(k=>{ const el=$('c_'+k); if(el) db.cfg[k]=el.value.trim(); });
  db.cfg.sh = db.sh;
  
  $('btnPush').disabled=true; $('btnPush').textContent='Pushing...';
  try{
    // Clean Data Payload (Removed DL Links safety)
    const pub={posts:db.posts.map(p=>{ const {eps,...rest}=p; return {...rest, eps: eps.map(({dl,...e})=>e)}; }), vip:db.vip, cfg:db.cfg, sh:db.sh};
    
    const r=await fetch(`/api/admin`,{
      method:'POST',
      headers: { 'Authorization': adminPassCode, 'Content-Type': 'application/json' },
      body: JSON.stringify(pub)
    });
    if(!r.ok) throw new Error(r.status+': '+(await r.text()).slice(0,200));
    log(`âœ… Saved to Turso Database Successfully!`);
  }catch(e){ log('Push fail: '+e.message,false); }
  
  $('btnPush').disabled=false; $('btnPush').textContent='ðŸš€ Push to Cloudflare Database';
}

function renderAll(){
  $('plist').innerHTML=db.posts.map(p=>`<div class="row"><div><b style="color:var(--ac);">${esc(p.name)}</b><br><small style="color:var(--mu)">${p.eps.length} eps</small></div></div>`).join('');
  renderEpSel();
  $('dlist').innerHTML=db.posts.map((p,i)=>`<div class="row"><div>${esc(p.name)}</div><button class="danger" onclick="delPost(${i})">Delete</button></div>`).join('');
  $('slist').innerHTML=db.sh.map((s,i)=>`<div class="row"><div>${esc(s.d)}</div><button class="danger" onclick="db.sh.splice(${i},1);renderAll()">Del</button></div>`).join('');
}
function renderEpSel(){ const q=$('eSearch').value.toLowerCase(); const filtered=db.posts.filter(p=>p.name.toLowerCase().includes(q)); $('eP').innerHTML=filtered.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''); }
function delPost(i){ if(confirm('Delete?')){ db.posts.splice(i,1); renderAll(); log('Deleted'); } }
function addSh(){ const d=$('sD').value.trim().replace(/^https?:\/\//,'').replace(/\/.*/,''); const k=$('sK').value.trim(); if(!d||!k) return; db.sh.push({d,k}); $('sD').value=$('sK').value=''; renderAll(); log('Added'); }
function addPost(){
  const name=$('pName').value.trim(); if(!name) return log('Name required',false);
  db.posts.unshift({id:Date.now().toString(36),img:$('pImg').value.trim(),name,cat:$('pCat').value.trim(),gen:$('pGen').value.split(',').map(s=>s.trim()).filter(Boolean),yr:$('pYr').value.trim(),story:$('pSt').value.trim(),updated:Date.now(),eps:[]});
  $('pName').value=''; log('Post added'); renderAll();
}

// ----------------------------------------------------
// UNIVERSAL SHORTENER BYPASS (SAB SHORTENERS CHALENGE)
// ----------------------------------------------------
async function addEpisode(){
  const post=db.posts.find(x=>x.id===$('eP').value); if(!post) return log('Post select karo',false);
  const real=$('eDl').value.trim(); if(!real) return log('Real DL daalo',false);
  if(!db.sh.length) return log('Shortener add karo pehle',false);

  $('btnEp').textContent = 'Generating Links...';
  const epId = Date.now().toString(36);

  let baseUrl = db.cfg.web? db.cfg.web.trim().replace(/\/$/, '') : window.location.origin;
  const targetUrl = `${baseUrl}/verify.html?id=${post.id}&ep=${epId}&done=1`;
  const shorts=[]; let lastErr='';
  
  for(const s of db.sh){
    try{
      const targetApiUrl = `https://${s.d}/api?api=${encodeURIComponent(s.k)}&url=${encodeURIComponent(targetUrl)}`;
      // CF Proxy bypasses CORS
      const r = await fetch(`/api/proxy?url=${encodeURIComponent(targetApiUrl)}`, { headers: { 'Authorization': adminPassCode } });
      const text = await r.text();
      let l = null;

      // UNIVERSAL PARSER (Har format handle karega)
      try {
          const j = JSON.parse(text);
          l = j.shortenedUrl || j.short_url || j.shortUrl || j.url || (j.data && (j.data.url || j.data.short_url));
      } catch(e) {}
      
      // Agar JSON format alag hua toh directly Text se link nikal lega
      if(!l){
          const m = text.match(/https?:\/\/[^\s"'\\]+/);
          if(m) l = m[0];
      }
      if(l) shorts.push(l); else lastErr = s.d+': '+text.slice(0,200);
    }catch(e){ console.log("Shortener Error:", e); }
  }

  if(!shorts.length) { $('btnEp').textContent = '+ Add Episode'; return log('Shortener fail ho gaya -> '+lastErr,false); }

  const vk=await getVk();
  const pd=await enc(real, vk);
  let play=$('ePl').value.trim(), lock=0; if(play && $('ePw').value.trim()){ play=await enc(play, $('ePw').value.trim()); lock=1; }

  post.eps.push({id:epId, s:$('eS').value.trim()||'01', n:$('eN').value.trim(), q:$('eQl').value, play, lock, pd, short:shorts});
  $('eN').value=$('eDl').value=''; $('btnEp').textContent = '+ Add Episode';
  log('Episode Added Successfully!');
}

async function addVip(){ const email=$('vE').value.trim().toLowerCase(), pass=$('vP').value.trim(); if(!email||!pass) return; const vk=await getVk(); const k=await enc(vk, pass); const h=await H(pass); db.vip.push({email,h,k,exp:Date.now()+parseInt($('vD').value)*86400000}); log('VIP added'); $('vE').value=$('vP').value=''; }
</script></body></html>
